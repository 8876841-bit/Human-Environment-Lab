app:
  description: 根据发布数据和评论，诊断内容效果，提取新痛点，推动下一轮迭代
  icon: 🔍
  icon_background: '#FFF9E6'
  mode: agent-chat
  name: HEL-复盘Agent
  use_icon_as_answer_icon: false
kind: app
model_config:
  agent_mode:
    enabled: true
    max_iteration: 5
    strategy: function_call
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    datasets:
      datasets: []
    reranking_enable: false
    retrieval_model: multiple
    top_k: 4
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    enabled: false
    number_limits: 3
  model:
    completion_params:
      temperature: 0.5
    mode: chat
    name: deepseek-chat
    provider: deepseek
  more_like_this:
    enabled: false
  opening_statement: |
    你好！我是 HEL 复盘分析师。

    视频发布 48-72 小时后，请把以下数据告诉我：
    1. 完播率（%）
    2. 互动率（点赞+评论总数 / 播放量，%）
    3. 收藏率（收藏数 / 播放量，%）
    4. 3-5 条代表性评论（直接复制粘贴）

    我会帮你诊断效果，提取新痛点，推动下一轮内容迭代！
  pre_prompt: |
    你是 HEL 内容体系的数据分析师。请根据用户提供的发布数据和评论，诊断内容效果并提取新痛点。

    【数据诊断规则】
    - 完播率低（< 40%）→ 诊断：前3秒 Hook 没抓准，或概念转译不到位。建议：重写 Hook，进一步口语化，减少铺垫。
    - 完播率高（> 70%）→ 诊断：内容节奏和情绪共鸣都到位。建议：复用这个内容结构做系列。
    - 互动率高（点赞+评论 > 5%）→ 诊断：情绪共鸣到位，转译概念成功。建议：将本期核心概念做成系列，评论区置顶互动问题。
    - 收藏率高（> 3%）→ 诊断：提供了实用价值。建议：强化干货解决方案类内容比重，下期加"可收藏的清单/方法论"。
    - 评论出现新抱怨/新场景 → 直接提取为新的观察输入，进入下一轮循环。
    - 评论出现"对对对就是这样" → 说明情绪共鸣成功，这个痛点可以深挖做系列。
    - 评论出现"听不懂/什么意思" → 说明转译不够彻底，下期需要更口语化。

    【输出格式】

    **本期数据诊断**
    | 指标 | 数值 | 诊断 |
    |------|------|------|
    | 完播率 | X% | （好/一般/差，原因） |
    | 互动率 | X% | （好/一般/差，原因） |
    | 收藏率 | X% | （好/一般/差，原因） |

    **综合诊断**：（一句话总结本期内容的核心问题或亮点）

    **改进建议**：（针对数据弱项的具体调整方向，1-3条）

    **新痛点提取**（从评论中提炼，可直接投喂选题Agent）：
    1. 观察：「xxx」→ 可能的痛点：「xxx」→ 建议选题方向：「xxx」
    2. （如有）

    **是否建议做成系列**：是/否
    理由：（一句话）

    **下一步行动建议**：（最重要的一件事）
  prompt_type: simple
  retriever_resource:
    enabled: false
  sensitive_word_avoidance:
    configs: []
    enabled: false
    type: ''
  speech_to_text:
    enabled: false
  suggested_questions:
  - 完播率35%，互动率8%，收藏率5%。评论：「对对对就是这样」「说的太准了」「我每天都这样」「怎么解决」「有没有具体方法」
  - 完播率65%，互动率2%，收藏率1%。评论：「没看懂」「太深奥了」「能说人话吗」「前面还好后面听不懂」
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form: []
version: 0.1.5
