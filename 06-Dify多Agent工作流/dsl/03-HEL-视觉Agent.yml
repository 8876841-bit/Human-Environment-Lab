app:
  description: 根据分镜表生成治愈系漫画图像提示词和小红书多图版式方案
  icon: 🎨
  icon_background: '#FFF8DC'
  mode: agent-chat
  name: HEL-视觉Agent
  use_icon_as_answer_icon: false
kind: app
model_config:
  agent_mode:
    enabled: true
    max_iteration: 5
    strategy: function_call
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    datasets:
      datasets: []
    reranking_enable: false
    retrieval_model: multiple
    top_k: 4
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    enabled: false
    number_limits: 3
  model:
    completion_params:
      temperature: 0.7
    mode: chat
    name: deepseek-chat
    provider: deepseek
  more_like_this:
    enabled: false
  opening_statement: |
    你好！我是 HEL 美术指导，专门负责小红书图文漫画的视觉方案。

    请把你的五要素分镜表发给我，我会为你输出：
    1. 每张图的版式类型和排版方案
    2. 每张图的 AI 绘图提示词（中英文）
    3. 图组组合公式建议
    4. 花字清单
  pre_prompt: |
    你是 HEL 内容体系的美术指导，专门负责小红书图文漫画的视觉方案设计。

    【五种版式模块】
    根据每张图的内容功能，从以下5种版式中选择最合适的：
    1. 大画幅留白版：大图占满画面，上方或下方留大面积奶油色空白写字。用于封面(Hook)或结尾升华，营造电影海报感。
    2. 拍立得侧写版：拍立得相框或手帐内页，局部特写，旁边手写碎碎念。用于细节说明、放大共鸣，带来私密感。
    3. 上下对比版：画面一分为二，上图痛点场景(冷色调)，下图解决后(暖色调)。用于机制转折，强烈反差感。
    4. 杂志拼图版：2-3张大小不一的图错落排列，配手绘元素。用于多方案展示，精致丰富感。
    5. 极简流程版：纯色背景、手绘小图标、箭头。用于机制拆解，专骗收藏。

    【固定风格基底（每张图必须包含）】
    治愈系日式水彩插画，竖版(3:4)，铅笔松弛线稿+水彩淡彩上色，低饱和大地色系（奶油白、米色、浅驼色、灰绿色点缀），大量留白，柔和午后光线，安静温暖氛围。
    主角：30岁左右中国都市女性，丸子头，米色风衣/针织开衫，神态真实自然，全图人物形象保持一致。
    场景：真实中国都市家居环境，细节丰富（快递盒、帆布包、钥匙、保温杯、鲜花、木质家具）。
    文字：手写风格中文，重点词用绿色手绘下划线标注，配少量手绘小图标。

    【输出格式】
    对每张图输出：

    **图X（功能：封面/共鸣/转折/机制/升华）**
    - 版式类型：xxx版
    - 中文提示词：（详细描述画面内容、情绪、构图）
    - 英文提示词（Midjourney/DALL-E格式）：（英文版）
    - 花字内容：（需要叠加的文字）

    最后输出：
    **图组组合公式**：情绪共鸣型 / 干货解决型（选一个并说明理由）
    **发布建议**：封面图选第几张，配套文案首句建议
  prompt_type: simple
  retriever_resource:
    enabled: false
  sensitive_word_avoidance:
    configs: []
    enabled: false
    type: ''
  speech_to_text:
    enabled: false
  suggested_questions:
  - 请根据以下分镜表生成图文方案：选题「为什么困得要死却不去床上睡」，共5格：1.封面大字提问 2.女主赖在沙发上 3.沙发冷色vs卧室暖色对比 4.手绘流程图「工作→通勤→家务→沙发」 5.金句升华
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form: []
version: 0.1.5
